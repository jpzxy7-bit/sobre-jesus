<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Content-Security-Policy"
content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none';">

<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="Referrer-Policy" content="strict-origin-when-cross-origin">

<title>Bíblia Sagrada | Caminho com Jesus</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f1e8;
    color: #2b241b;
    transition: .3s;
}

header {
    background: #17130f;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

nav a,
nav button {
    color: white;
    background: transparent;
    border: 1px solid #777;
    padding: 9px 13px;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
}

nav a:hover,
nav button:hover {
    background: #333;
}

.hero {
    text-align: center;
    padding: 55px 20px 35px;
    background:
        linear-gradient(rgba(20,15,10,.68), rgba(20,15,10,.68)),
        url("imagens/biblia.jpg") center/cover;
    color: white;
}

.hero h1 {
    font-size: clamp(34px, 6vw, 60px);
    margin-bottom: 12px;
}

.hero p {
    font-size: 18px;
}

.controls {
    max-width: 1100px;
    margin: 25px auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 2fr auto;
    gap: 12px;
}

select,
input,
button {
    font-family: inherit;
}

select,
input {
    width: 100%;
    padding: 13px;
    border: 1px solid #c8bda9;
    border-radius: 9px;
    background: white;
    color: #2b241b;
}

.controls button,
.action-button {
    border: none;
    border-radius: 9px;
    padding: 13px 18px;
    cursor: pointer;
    background: #6f542f;
    color: white;
    font-weight: bold;
}

.reader {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.chapter-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 25px;
}

.verse {
    background: rgba(255,255,255,.7);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 9px;
    line-height: 1.8;
    font-size: 18px;
    border: 1px solid #e2d8c8;
}

.verse-number {
    font-weight: bold;
    color: #806238;
    margin-right: 8px;
}

mark.highlight {
    background: #f3d76b;
    color: #201a11;
    border-radius: 3px;
    padding: 1px 2px;
}

.toolbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #17130f;
    padding: 10px;
    border-radius: 12px;
    display: flex;
    gap: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    z-index: 20;
}

.toolbar button {
    border: none;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.info {
    max-width: 900px;
    margin: 30px auto 100px;
    padding: 20px;
    text-align: center;
    color: #6c6255;
}

.search-results {
    max-width: 900px;
    margin: 0 auto 30px;
    padding: 0 20px;
}

.result {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid #ddd;
}

.dark {
    background: #121212;
    color: #eee;
}

.dark .verse {
    background: #1d1d1d;
    border-color: #333;
}

.dark select,
.dark input {
    background: #222;
    color: white;
    border-color: #444;
}

.dark .result {
    background: #1d1d1d;
    border-color: #333;
}

.dark .info {
    color: #aaa;
}

@media(max-width:800px) {
    .controls {
        grid-template-columns: 1fr;
        padding: 15px;
    }

    header {
        flex-direction: column;
    }

    .hero {
        padding: 45px 15px;
    }

    .verse {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">✝ Caminho com Jesus</div>

    <nav>
        <a href="index.html">Início</a>
        <a href="index.html#jesus">Jesus</a>
        <a href="index.html#pecados">Pecados</a>
        <button onclick="alternarTema()">🌙 Tema</button>
    </nav>
</header>

<section class="hero">
    <h1>📖 Bíblia Sagrada</h1>
    <p>Leia, pesquise e marque os versículos importantes para você.</p>
</section>

<section class="controls">

    <select id="livro">
        <option value="">Escolha o livro</option>
    </select>

    <select id="capitulo">
        <option value="">Capítulo</option>
    </select>

    <input
        id="busca"
        type="search"
        placeholder="Pesquisar na Bíblia..."
    >

    <button onclick="pesquisar()">Pesquisar</button>

</section>

<div id="resultados" class="search-results"></div>

<main class="reader">

    <h2 id="tituloCapitulo" class="chapter-title">
        Escolha um livro e capítulo
    </h2>

    <div id="textoBiblia"></div>

</main>

<div class="toolbar">
    <button onclick="grifar()">🖍️ Grifar</button>
    <button onclick="desgrifar()">↩️ Desgrifar</button>
    <button onclick="limparGrifos()">🗑️ Limpar</button>
</div>

<div class="info">
    <p>
        Seus grifos ficam salvos somente neste navegador.
    </p>
</div>

<script>

let biblia = {};
let livroAtual = "";
let capituloAtual = "";

const livrosOrdem = [
    "Gênesis",
    "Êxodo",
    "Levítico",
    "Números",
    "Deuteronômio",
    "Josué",
    "Juízes",
    "Rute",
    "1 Samuel",
    "2 Samuel",
    "1 Reis",
    "2 Reis",
    "1 Crônicas",
    "2 Crônicas",
    "Esdras",
    "Neemias",
    "Ester",
    "Jó",
    "Salmos",
    "Provérbios",
    "Eclesiastes",
    "Cânticos",
    "Isaías",
    "Jeremias",
    "Lamentações",
    "Ezequiel",
    "Daniel",
    "Oséias",
    "Joel",
    "Amós",
    "Obadias",
    "Jonas",
    "Miquéias",
    "Naum",
    "Habacuque",
    "Sofonias",
    "Ageu",
    "Zacarias",
    "Malaquias",

    "Mateus",
    "Marcos",
    "Lucas",
    "João",
    "Atos",
    "Romanos",
    "1 Coríntios",
    "2 Coríntios",
    "Gálatas",
    "Efésios",
    "Filipenses",
    "Colossenses",
    "1 Tessalonicenses",
    "2 Tessalonicenses",
    "1 Timóteo",
    "2 Timóteo",
    "Tito",
    "Filemom",
    "Hebreus",
    "Tiago",
    "1 Pedro",
    "2 Pedro",
    "1 João",
    "2 João",
    "3 João",
    "Judas",
    "Apocalipse"
];

const livroSelect = document.getElementById("livro");
const capituloSelect = document.getElementById("capitulo");
const textoBiblia = document.getElementById("textoBiblia");
const titulo = document.getElementById("tituloCapitulo");

async function iniciar() {

    try {

        const resposta = await fetch("bibliadados.json");

        if (!resposta.ok) {
            throw new Error("Arquivo não encontrado");
        }

        biblia = await resposta.json();

        livrosOrdem.forEach(nome => {

            if (biblia[nome]) {

                const option = document.createElement("option");

                option.value = nome;
                option.textContent = nome;

                livroSelect.appendChild(option);
            }

        });

    } catch (erro) {

        textoBiblia.innerHTML = `
            <div class="verse">
                <strong>A Bíblia ainda não foi carregada.</strong>
                <br><br>
                Coloque o arquivo <b>bibliadados.json</b>
                na mesma pasta deste arquivo.
            </div>
        `;
    }
}

livroSelect.addEventListener("change", () => {

    livroAtual = livroSelect.value;

    capituloSelect.innerHTML =
        '<option value="">Capítulo</option>';

    if (!livroAtual || !biblia[livroAtual]) return;

    Object.keys(biblia[livroAtual]).forEach(cap => {

        const option = document.createElement("option");

        option.value = cap;
        option.textContent = cap;

        capituloSelect.appendChild(option);
    });
});

capituloSelect.addEventListener("change", () => {

    capituloAtual = capituloSelect.value;

    mostrarCapitulo();
});

function mostrarCapitulo() {

    if (!livroAtual || !capituloAtual) return;

    const versiculos = biblia[livroAtual][capituloAtual];

    titulo.textContent =
        livroAtual + " " + capituloAtual;

    textoBiblia.innerHTML = "";

    versiculos.forEach((texto, index) => {

        const div = document.createElement("div");

        div.className = "verse";

        div.dataset.versiculo = index + 1;

        div.innerHTML =
            `<span class="verse-number">${index + 1}</span>` +
            escapeHTML(texto);

        textoBiblia.appendChild(div);
    });

    restaurarGrifos();
}

function escapeHTML(texto) {

    return texto
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function grifar() {

    const selecao = window.getSelection();

    if (!selecao || selecao.rangeCount === 0) {
        alert("Selecione um trecho do versículo primeiro.");
        return;
    }

    const range = selecao.getRangeAt(0);

    if (!textoBiblia.contains(range.commonAncestorContainer)) {
        return;
    }

    const mark = document.createElement("mark");

    mark.className = "highlight";

    try {

        range.surroundContents(mark);

    } catch {

        alert(
            "Selecione apenas um trecho dentro do mesmo versículo."
        );

        return;
    }

    salvarGrifos();

    selecao.removeAllRanges();
}

function desgrifar() {

    const selecao = window.getSelection();

    if (!selecao || selecao.rangeCount === 0) {
        alert("Selecione o trecho grifado.");
        return;
    }

    let elemento = selecao.anchorNode;

    if (elemento && elemento.nodeType === 3) {
        elemento = elemento.parentElement;
    }

    if (
        elemento &&
        elemento.classList &&
        elemento.classList.contains("highlight")
    ) {

        elemento.replaceWith(...elemento.childNodes);

        salvarGrifos();
    }
}

function salvarGrifos() {

    const grifos = [];

    document
        .querySelectorAll(".highlight")
        .forEach(mark => {

            const verso = mark.closest(".verse");

            if (!verso) return;

            grifos.push({
                livro: livroAtual,
                capitulo: capituloAtual,
                versiculo: verso.dataset.versiculo,
                texto: mark.textContent
            });

        });

    const todos =
        JSON.parse(
            localStorage.getItem("caminhoJesusHighlights") || "[]"
        );

    const outros = todos.filter(item =>
        !(
            item.livro === livroAtual &&
            item.capitulo === capituloAtual
        )
    );

    localStorage.setItem(
        "caminhoJesusHighlights",
        JSON.stringify([...outros, ...grifos])
    );
}

function restaurarGrifos() {

    const todos =
        JSON.parse(
            localStorage.getItem("caminhoJesusHighlights") || "[]"
        );

    const atuais = todos.filter(item =>
        item.livro === livroAtual &&
        item.capitulo === capituloAtual
    );

    atuais.forEach(item => {

        const verso =
            document.querySelector(
                `.verse[data-versiculo="${item.versiculo}"]`
            );

        if (!verso) return;

        destacarTexto(verso, item.texto);
    });
}

function destacarTexto(elemento, texto) {

    const walker =
        document.createTreeWalker(
            elemento,
            NodeFilter.SHOW_TEXT
        );

    let node;

    while (node = walker.nextNode()) {

        const inicio = node.nodeValue.indexOf(texto);

        if (inicio === -1) continue;

        const range = document.createRange();

        range.setStart(node, inicio);
        range.setEnd(node, inicio + texto.length);

        const mark = document.createElement("mark");

        mark.className = "highlight";

        range.surroundContents(mark);

        break;
    }
}

function limparGrifos() {

    if (!confirm("Apagar todos os grifos salvos?")) {
        return;
    }

    localStorage.removeItem("caminhoJesusHighlights");

    document
        .querySelectorAll(".highlight")
        .forEach(mark => {
            mark.replaceWith(...mark.childNodes);
        });
}

function pesquisar() {

    const termo =
        document
            .getElementById("busca")
            .value
            .trim()
            .toLowerCase();

    const resultados =
        document.getElementById("resultados");

    resultados.innerHTML = "";

    if (!termo) return;

    let quantidade = 0;

    for (const livro of Object.keys(biblia)) {

        for (const capitulo of Object.keys(biblia[livro])) {

            const versiculos =
                biblia[livro][capitulo];

            versiculos.forEach((texto, index) => {

                if (
                    texto
                        .toLowerCase()
                        .includes(termo)
                ) {

                    quantidade++;

                    if (quantidade <= 100) {

                        const div =
                            document.createElement("div");

                        div.className = "result";

                        div.innerHTML =
                            `<strong>${livro} ${capitulo}:${index + 1}</strong>
                            <br>${escapeHTML(texto)}`;

                        div.onclick = () => {

                            livroAtual = livro;
                            capituloAtual = capitulo;

                            livroSelect.value = livro;

                            livroSelect.dispatchEvent(
                                new Event("change")
                            );

                            capituloSelect.value = capitulo;

                            mostrarCapitulo();

                            window.scrollTo({
                                top: 350,
                                behavior: "smooth"
                            });
                        };

                        resultados.appendChild(div);
                    }
                }
            });
        }
    }

    if (quantidade === 0) {

        resultados.innerHTML =
            "<p>Nenhum resultado encontrado.</p>";

    } else if (quantidade > 100) {

        resultados.innerHTML +=
            `<p>Mostrando os primeiros 100 resultados de ${quantidade}.</p>`;
    }
}

function alternarTema() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "bibleTheme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );
}

if (localStorage.getItem("bibleTheme") === "dark") {
    document.body.classList.add("dark");
}

iniciar();

</script>

</body>
</html>
